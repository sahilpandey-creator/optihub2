<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>
<body>

<div class="container flex bg-black">

    <!-- LEFT SECTION -->
    <div class="left">

        <div class="home bg-grey rounded m-1 p-1">

            <div class="logo">
                <img src="logo.svg" alt="">
            </div>

            <ul>
                <li>
                    <img class="invert" src="home.svg" alt="">
                    Home
                </li>

                <li>
                    <img class="invert" src="search.svg" alt="">
                    Search
                </li>
            </ul>

        </div>

        <div class="library bg-grey rounded m-1 p-1">

            <div class="heading">

                <img class="invert" src="playlist.svg" alt="">

                <h2>Your Library</h2>

            </div>

            <div class="songlist">

                <ul>

                </ul>

            </div>

            <div class="footer">

                <a href="#">Legal</a>
                <a href="#">Privacy</a>
                <a href="#">Cookies</a>
                <a href="#">About Ads</a>

            </div>

        </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right bg-grey rounded">

        <div class="header">

            <div class="nav">

                <img class="invert" src="prevsong.svg" width="25">

                <img class="invert" src="nextsong.svg" width="25">

            </div>

            <div class="buttons">

                <button class="signupbtn">
                    Sign Up
                </button>

                <button class="loginbtn">
                    Login
                </button>

            </div>

        </div>

        <div class="spotifyplaylist">

            <h1>Spotify Playlists</h1>

            <div class="cardcontainer">

                <div class="card">

                    <div class="play">

                        <img src="play.svg" width="25">

                    </div>

                    <img src="https://i.scdn.co/image/ab67616d00001e026bd8995a48cd48ab99a1a88f" alt="">

                    <h2>Happy Hits!</h2>

                    <p>
                        Hits to boost your mood and fill you with happiness.
                    </p>

                </div>

            </div>

        </div>

        <!-- PLAYBAR -->

        <div class="playbar">

            <div class="seekbar">

                <div class="circle"></div>

            </div>

            <div class="songinfo">

            </div>

            <div class="songbuttons">

                <img id="previous" src="prevsong.svg" alt="">

                <img id="play" src="play.svg" alt="">

                <img id="next" src="nextsong.svg" alt="">

            </div>

            <div class="songtime">

                00:00 / 00:00

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
